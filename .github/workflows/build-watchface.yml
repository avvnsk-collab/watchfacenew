name: Build Amazfit Balance 2 watchface

on:
  push:
    branches: [main]
    paths:
      - 'amg_petronas_Balance_2_reference_match_source.zip'
      - '.github/workflows/build-watchface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Unpack source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q amg_petronas_Balance_2_reference_match_source.zip -d build-src

      - name: Build watchface
        working-directory: build-src
        run: zeus build

      - name: Collect ZAB and extract ZPK packages
        run: |
          rm -rf release-new zab-unpacked
          mkdir -p release-new zab-unpacked
          zab=$(find build-src/dist -type f -name '*.zab' | head -n 1)
          if [ -z "$zab" ]; then
            echo 'No .zab package produced by zeus build' >&2
            exit 1
          fi
          cp "$zab" release-new/amg_petronas_Balance_2.zab
          echo 'ZAB contents:'
          unzip -l "$zab" || true
          unzip -q "$zab" -d zab-unpacked
          echo 'Extracted files:'
          find zab-unpacked -type f -print
          mapfile -t zpks < <(find zab-unpacked -type f -name '*.zpk' | sort)
          if [ "${#zpks[@]}" -eq 0 ]; then
            echo 'No .zpk packages found inside ZAB' >&2
            exit 1
          fi
          i=1
          for zpk in "${zpks[@]}"; do
            base=$(basename "$zpk")
            safe=$(printf '%s' "$base" | tr ' ' '_' | tr -cd 'A-Za-z0-9._-')
            cp "$zpk" "release-new/${i}_${safe}"
            i=$((i+1))
          done

      - name: Generate Zepp install QR codes
        run: |
          python -m pip install --quiet qrcode[pil]
          python - <<'PY'
          from pathlib import Path
          import qrcode
          owner='avvnsk-collab'
          repo='watchfacenew'
          branch='main'
          folder=Path('release-new')
          for p in sorted(folder.glob('*.zpk')):
              https=f'https://raw.githubusercontent.com/{owner}/{repo}/{branch}/release/{p.name}'
              zepp='zpkd1://' + https.removeprefix('https://')
              img=qrcode.make(zepp)
              out=folder/(p.stem + '_QR.png')
              img.save(out)
              (folder/(p.stem + '_INSTALL.txt')).write_text(zepp+'\n', encoding='utf-8')
              print(p.name, zepp)
          PY

      - name: Publish install files
        run: |
          rm -rf release
          mv release-new release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build Balance 2 install packages and QR codes'
            git push
          fi
