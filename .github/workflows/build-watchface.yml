name: Build Amazfit Balance 2 watchface

on:
  push:
    branches: [main]
    paths:
      - 'amg_petronas_Balance_2_reference_match_source.zip'
      - '.github/workflows/build-watchface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Unpack source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q amg_petronas_Balance_2_reference_match_source.zip -d build-src

      - name: Normalize PNG resources for Zeus
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for p in Path('build-src/assets').rglob('*.png'):
              try:
                  im = Image.open(p)
                  if im.mode in ('L', 'LA', 'P'):
                      im = im.convert('RGBA')
                  elif im.mode != 'RGBA':
                      im = im.convert('RGBA')
                  im.save(p, format='PNG')
                  print('normalized', p, im.size)
              except Exception as e:
                  print('skip', p, e)
          PY

      - name: Build watchface
        working-directory: build-src
        run: zeus build

      - name: Collect stable install package
        run: |
          rm -rf release-new zab-unpacked
          mkdir -p release-new zab-unpacked
          zab=$(find build-src/dist -type f -name '*.zab' | head -n 1)
          if [ -z "$zab" ]; then
            echo 'No .zab package produced by zeus build' >&2
            exit 1
          fi
          cp "$zab" release-new/amg_petronas_Balance_2.zab
          unzip -q "$zab" -d zab-unpacked
          zpk=$(find zab-unpacked -type f -name '*.zpk' | head -n 1)
          if [ -z "$zpk" ]; then
            echo 'No .zpk package found inside ZAB' >&2
            exit 1
          fi
          cp "$zpk" release-new/amg_petronas_Balance_2.zpk

      - name: Generate stable Zepp install QR
        run: |
          python -m pip install --quiet qrcode[pil]
          python - <<'PY'
          from pathlib import Path
          import qrcode
          zepp='zpkd1://raw.githubusercontent.com/avvnsk-collab/watchfacenew/main/release/amg_petronas_Balance_2.zpk'
          folder=Path('release-new')
          qrcode.make(zepp).save(folder/'amg_petronas_Balance_2_QR.png')
          (folder/'amg_petronas_Balance_2_INSTALL.txt').write_text(zepp+'\n', encoding='utf-8')
          print(zepp)
          PY

      - name: Publish install files
        run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p release
          cp -f release-new/amg_petronas_Balance_2.zab release/amg_petronas_Balance_2.zab
          cp -f release-new/amg_petronas_Balance_2.zpk release/amg_petronas_Balance_2.zpk
          cp -f release-new/amg_petronas_Balance_2_QR.png release/amg_petronas_Balance_2_QR.png
          cp -f release-new/amg_petronas_Balance_2_INSTALL.txt release/amg_petronas_Balance_2_INSTALL.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/amg_petronas_Balance_2.zab release/amg_petronas_Balance_2.zpk release/amg_petronas_Balance_2_QR.png release/amg_petronas_Balance_2_INSTALL.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build Balance 2 stable install package and QR'
            git push origin HEAD:main
          fi
